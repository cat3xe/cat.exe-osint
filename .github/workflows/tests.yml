name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Installer les modules
        run: python -m pip install -q -r requirements.txt pyflakes
      - name: Vérifier la syntaxe et les noms
        run: |
          python -m py_compile osint_tool.py geo_core.py pages_html.py textes.py
          python -m pyflakes osint_tool.py geo_core.py | (! grep -E "undefined name")
      - name: Lancer les tests
        run: python -m unittest discover -s tests -v
